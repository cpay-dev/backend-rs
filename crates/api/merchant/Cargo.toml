[package]
name = "api-merchant"
version = "1.0.1"
edition = "2024"

[dependencies]
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "rt"] }
axum = { version = "=0.8.4", features = ["http2"] }
thiserror = "=2.0.14"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "env-filter"] }
cpay-proto = { git = "https://github.com/cpay-dev/proto-rs", rev = "aa937cab54fd38151771f220f0404b15280d1474" }
tonic = { version = "=0.14.2", features = ["transport"] }
tower-http = { version = "=0.6.6", features = ["trace"] }
serde = { version = "=1.0.223", features = ["derive"] }
serde_json = "=1.0.145"
http = "=1.3.1"
