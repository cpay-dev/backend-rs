[package]
name = "api-wallet"
version = "1.0.1"
edition = "2024"

[dependencies]
thiserror = "=2.0.16"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "env-filter"] }
zeroize = { version = "=1.8.1" }
chacha20poly1305 = { version = "=0.11.0-rc.1", features = ["zeroize"] }
cpay-proto = { git = "https://github.com/cpay-dev/proto-rs", rev = "a308006c65a0c268df23a03bde859b8835eca85b" }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "rt", "signal"] }
tokio-stream = "=0.1.17"
tonic = { version = "=0.14.2", features = ["transport"] }
serde = { version = "=1.0.226", features = ["derive"] }
lib-crypto = { path = "../../lib/crypto" }
alloy = { version = "=1.0.34" }
app-config = { path = "../../lib/app-config" }

[dev-dependencies]
tonic = { version = "=0.14.2", features = ["transport", "tls-aws-lc"] }
