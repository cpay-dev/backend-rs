[package]
name = "blockchain-tx-parser-evm"
version = "1.0.1"
edition = "2024"

[dependencies]
thiserror = "=2.0.16"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "env-filter"] }
serde = { version = "=1.0.226", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "rt", "signal"] }
futures-util = { version = "=0.3.31", default-features = false }
alloy = { version = "=1.0.34", default-features = false, features = ["consensus", "network", "sol-types"] }
rand = "=0.10.0-rc.0"
app-config = { path = "../../lib/app-config" }
async-nats = { version = "=0.42.0", default-features = false, features = ["server_2_10", "server_2_11", "aws-lc-rs"] }
cpay-proto = { git = "https://github.com/cpay-dev/proto-rs", rev = "1150db9abe4739c55f8234eaaf5759c5e99b75fa" }
prost = "=0.14.1"
